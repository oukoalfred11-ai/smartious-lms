<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Smartious</title>
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 38%, #9A1B33, #6E1022 60%, #3E0712);
    color: #FBF6EA; font: 15px/1.5 -apple-system, "Segoe UI", Roboto, Inter, sans-serif;
    text-align: center; padding: 24px; box-sizing: border-box;
  }
  .card { max-width: 340px; }
  h1 { font: 700 30px/1.15 Georgia, "Times New Roman", serif; margin: 22px 0 8px; }
  h1 em { color: #E9C766; font-weight: 400; }
  p { opacity: .85; margin: 0 0 26px; }
  button {
    appearance: none; border: 0; border-radius: 999px; padding: 14px 30px;
    background: linear-gradient(135deg, #F3D36B, #C9A030); color: #3E0712;
    font: 700 15px/1 inherit; letter-spacing: .02em; cursor: pointer;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
    -webkit-tap-highlight-color: transparent; transition: transform .12s;
  }
  button:active { transform: scale(.96); }
  .hint { margin-top: 18px; font-size: 12.5px; opacity: .6; }
</style>
</head>
<body>
  <div class="card">
    <svg width="76" height="86" viewBox="0 0 64 72" aria-hidden="true">
      <path d="M4 4 L60 4 L60 44 Q60 56 32 68 Q4 56 4 44 Z" fill="#C9A030"/>
      <path d="M7 7 L57 7 L57 44 Q57 54 32 65 Q7 54 7 44 Z" fill="#7D1025"/>
      <polygon points="32,15 34,21 40.3,21 35.2,24.8 37.2,30.8 32,27.1 26.8,30.8 28.8,24.8 23.7,21 30,21" fill="#E9C766"/>
      <path d="M15.5 36.5 Q24 32.4 31.4 34.6 L31.4 53 Q24 50.8 15.5 54.6 Z" fill="#FFFDF8"/>
      <path d="M48.5 36.5 Q40 32.4 32.6 34.6 L32.6 53 Q40 50.8 48.5 54.6 Z" fill="#FFFDF8"/>
    </svg>
    <h1>Smart<em>ious</em></h1>
    <p>We can't reach the school right now. Check your internet connection and try again.</p>
    <button id="retry" type="button">Try again</button>
    <div class="hint" id="hint">We'll reconnect automatically when you're back online.</div>
  </div>
<script>
  var HOME = 'https://smartioushomeschool.com/portal';
  try { window.smartiousDesktop && window.smartiousDesktop.ready(); } catch (e) {}
  function go() {
    
    document.getElementById('hint').textContent = 'Connecting…';
    window.location.replace(HOME);
  }
  document.getElementById('retry').addEventListener('click', go);
  window.addEventListener('online', go);
</script>
</body>
</html>
