<!-- Static form skeleton for Netlify Forms build-time detection -->
<html>
<body>
  <form name="consultation" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="consultation" />
    <input name="bot-field" />
    <input name="name" />
    <input name="email" />
    <input name="phone" />
    <input name="country" />
    <input name="curriculum" />
    <textarea name="message"></textarea>
  </form>

  <form name="enrollment" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="enrollment" />
    <input name="bot-field" />
    <input name="programme" />
    <input name="curriculum" />
    <input name="learningMode" />
    <input name="studentFirstName" />
    <input name="studentLastName" />
    <input name="parentEmail" />
    <input name="whatsappNumber" />
    <input name="studentDOB" />
    <input name="country" />
    <input name="howHeard" />
  </form>

  <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="contact" />
    <input name="bot-field" />
    <input name="name" />
    <input name="email" />
    <input name="subject" />
    <textarea name="message"></textarea>
  </form>
</body>
</html>
