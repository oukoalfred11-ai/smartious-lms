<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smartious Library Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #525659; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    #toolbar {
      position: fixed; top: 0; left: 0; right: 0; height: 52px;
      background: linear-gradient(135deg, #7D1025 0%, #5A0B1B 100%);
      display: flex; align-items: center; gap: 8px; padding: 0 16px;
      z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,.4);
    }
    #title { flex: 1; min-width: 0; }
    #title h1 { font-size: 13px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #title p  { font-size: 10px; color: rgba(255,255,255,.65); margin-top: 1px; }
    .tb-btn { border: none; border-radius: 6px; padding: 6px 12px; font-size: 11px; font-weight: 700; cursor: pointer; background: rgba(255,255,255,.15); color: #fff; white-space: nowrap; }
    .tb-btn:disabled { opacity: .4; cursor: not-allowed; }
    .sep { width: 1px; height: 20px; background: rgba(255,255,255,.25); margin: 0 4px; flex-shrink: 0; }
    #page-info { color: #fff; font-size: 11px; min-width: 70px; text-align: center; white-space: nowrap; }
    #zoom-info { color: #fff; font-size: 11px; min-width: 38px; text-align: center; }
    #viewer-container {
      position: fixed; top: 52px; left: 0; right: 0; bottom: 0;
      overflow-y: auto; overflow-x: auto;
      display: flex; flex-direction: column; align-items: center;
      padding: 20px 16px; gap: 10px;
    }
    /* flex-shrink:0 is load-bearing: the container is a column flex
       box, and without it flexbox compresses all pages to fit the
       screen, collapsing the whole book into invisible slivers. */
    .page-wrapper { flex-shrink: 0; box-shadow: 0 4px 24px rgba(0,0,0,.5); border-radius: 2px; overflow: hidden; background: #fff; }
    .page-wrapper canvas { display: block; }
    #loading {
      position: fixed; inset: 52px 0 0 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      background: #525659; z-index: 10;
    }
    .spinner { width: 44px; height: 44px; border: 4px solid rgba(255,255,255,.15); border-top-color: #C9A030; border-radius: 50%; animation: spin .75s linear infinite; }
    #loading p { color: #fff; font-size: 14px; font-weight: 600; }
    #loading small { color: rgba(255,255,255,.5); font-size: 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #error { display: none; position: fixed; inset: 52px 0 0 0; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: #fff; text-align: center; padding: 30px; }
    #error h2 { font-size: 18px; }
    #error p  { font-size: 13px; opacity: .7; max-width: 400px; line-height: 1.6; }
    #error a  { background: #C9A030; color: #7D1025; padding: 10px 24px; border-radius: 8px; font-weight: 800; font-size: 13px; text-decoration: none; display: inline-block; margin-top: 8px; }
    #watermark { position: fixed; bottom: 8px; left: 0; right: 0; text-align: center; color: rgba(255,255,255,.2); font-size: 10px; letter-spacing: .08em; pointer-events: none; }
  </style>
</head>
<body>
<div id="toolbar">
  <div id="title" style="display:none"><h1 id="book-title">Loading...</h1><p id="book-meta"></p></div>
  <button class="tb-btn" id="btn-zoom-out">−</button>
  <span id="zoom-info">90%</span>
  <button class="tb-btn" id="btn-zoom-in">+</button>
  <div class="sep"></div>
  <button class="tb-btn" id="btn-prev" disabled>‹</button>
  <span id="page-info">— / —</span>
  <button class="tb-btn" id="btn-next" disabled>›</button>
  <div class="sep"></div>
  <button class="tb-btn" id="btn-fs">Fullscreen</button>
</div>
<div id="loading">
  <div class="spinner"></div>
  <p id="loading-text">Opening book...</p>
  <small id="loading-sub">First pages appear before the full download finishes</small>
</div>
<div id="error">
  <h2>Could not open this book</h2>
  <p id="error-msg"></p>
  <a id="error-link" href="#" target="_blank">Open directly</a>
</div>
<div id="viewer-container"></div>
<div id="watermark">For personal reading only — Smartious Homeschool</div>

<script type="module">
  const params  = new URLSearchParams(location.search)
  const bookId  = params.get('id')
  const apiBase = params.get('api')
  const token   = params.get('token')
  const title   = params.get('title') || 'Coursebook'
  const meta    = params.get('meta')  || ''

  document.getElementById('book-title').textContent = title
  document.getElementById('book-meta').textContent  = meta

  function showError(msg, url) {
    document.getElementById('loading').style.display = 'none'
    const el = document.getElementById('error')
    el.style.display = 'flex'
    document.getElementById('error-msg').textContent = msg
    if (url) document.getElementById('error-link').href = url
  }

  if (!bookId || !apiBase || !token) {
    showError('Missing parameters. Please reopen this book from the library.')
    throw new Error('Missing params')
  }

  let directUrl = ''
  const streamUrl = `${apiBase}/library/${bookId}/stream`

  // Fetch the book's metadata in the background for the fallback
  // "Open directly" link. Never blocks the reader.
  fetch(`${apiBase}/library/${bookId}`, { headers: { Authorization: `Bearer ${token}` } })
    .then(r => r.ok ? r.json() : null)
    .then(j => { directUrl = j?.data?.book?.url || '' })
    .catch(() => {})

  // ── FULL-DOWNLOAD FALLBACK ─────────────────────────────
  // Only used when range-based loading fails (older browsers,
  // a proxy that strips Range headers, corrupt xref). Downloads
  // the whole file with a live percentage, exactly as before.
  async function fetchPdfAsBlob() {
    document.getElementById('loading-text').textContent = 'Downloading PDF...'
    document.getElementById('loading-sub').textContent  = 'Large files may take a moment'

    const pdfRes = await fetch(streamUrl, {
      headers: { Authorization: `Bearer ${token}` }
    })
    if (!pdfRes.ok) throw new Error('Could not fetch PDF (' + pdfRes.status + ')')

    const contentLength = pdfRes.headers.get('Content-Length')
    if (!contentLength || !pdfRes.body) {
      return await pdfRes.arrayBuffer()
    }

    const total  = parseInt(contentLength, 10)
    const reader = pdfRes.body.getReader()
    const chunks = []
    let received = 0
    while (true) {
      const { done, value } = await reader.read()
      if (done) break
      chunks.push(value)
      received += value.length
      const pct = Math.round((received / total) * 100)
      document.getElementById('loading-text').textContent = 'Downloading... ' + pct + '%'
    }
    const buf = new Uint8Array(received)
    let off = 0
    for (const c of chunks) { buf.set(c, off); off += c.length }
    return buf.buffer
  }

  const pdfjsLib = await import('./pdf.min.mjs')
  pdfjsLib.GlobalWorkerOptions.workerSrc = './pdf.worker.min.mjs'

  let pdfDoc = null, numPages = 0, scale = 0.9, currentPage = 1
  const container = document.getElementById('viewer-container')
  const pageInfo  = document.getElementById('page-info')
  const zoomInfo  = document.getElementById('zoom-info')
  const btnPrev   = document.getElementById('btn-prev')
  const btnNext   = document.getElementById('btn-next')

  function updateUI() {
    pageInfo.textContent = currentPage + ' / ' + numPages
    zoomInfo.textContent = Math.round(scale * 100) + '%'
    btnPrev.disabled = currentPage <= 1
    btnNext.disabled = currentPage >= numPages
  }

  let renderFails = 0
  let rescuing = false
  async function renderPage(p) {
    if (!pdfDoc) return
    try {
      const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('page ' + p + ' timed out')), 20000))
      const page = await Promise.race([pdfDoc.getPage(p), timeout])
      const vp   = page.getViewport({ scale })
      const wrap = document.getElementById('page-' + p)
      if (!wrap) return
      let cv = wrap.querySelector('canvas')
      if (!cv) { cv = document.createElement('canvas'); wrap.appendChild(cv) }
      wrap.style.width = vp.width + 'px'; wrap.style.height = vp.height + 'px'
      cv.width = vp.width; cv.height = vp.height
      cv.style.width = vp.width + 'px'; cv.style.height = vp.height + 'px'
      const rTimeout = new Promise((_, rej) => setTimeout(() => rej(new Error('render ' + p + ' timed out')), 20000))
      await Promise.race([page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise, rTimeout])
    } catch(e) {
      console.error('render error p' + p, e)
      renderFails++
      // Pages failing while the document opened means the range
      // transport handed pdf.js bad slices (a proxy or cache along
      // the way). Rescue once: throw the ranged document away and
      // rebuild from one clean full download.
      if (renderFails >= 2 && !rescuing) {
        rescuing = true
        try {
          document.getElementById('loading').style.display = ''
          const buf = await fetchPdfAsBlob()
          document.getElementById('loading-text').textContent = 'Rendering...'
          pdfDoc = await pdfjsLib.getDocument({
            data: buf,
            cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/cmaps/', cMapPacked: true,
            standardFontDataUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/standard_fonts/',
          }).promise
          numPages = pdfDoc.numPages
          renderFails = 0
          await buildViewer()
        } catch (e2) {
          console.error('[viewer] rescue failed', e2)
          showError((e2 && e2.message) || 'The book could not be displayed.', directUrl)
        }
      }
    }
  }

  async function buildViewer() {
    container.innerHTML = ''
    const w = Math.round(595 * scale), h = Math.round(842 * scale)
    for (let p = 1; p <= numPages; p++) {
      const wrap = document.createElement('div')
      wrap.className = 'page-wrapper'; wrap.id = 'page-' + p; wrap.dataset.page = p
      wrap.style.width = w + 'px'; wrap.style.height = h + 'px'
      container.appendChild(wrap)
    }
    for (let p = 1; p <= Math.min(2, numPages); p++) await renderPage(p)

    const obs = new IntersectionObserver(async entries => {
      for (const e of entries) if (e.isIntersecting) {
        const p = Number(e.target.dataset.page)
        if (!e.target.querySelector('canvas')) await renderPage(p)
        currentPage = p; updateUI()
      }
    }, { rootMargin: '400px' })
    container.querySelectorAll('.page-wrapper').forEach(el => obs.observe(el))
    document.getElementById('loading').style.display = 'none'
    updateUI()
  }

  // ── PROGRESSIVE LOAD (the fix for 80 MB coursebooks) ───
  // pdf.js is given the URL rather than a downloaded buffer, so it
  // reads the file structure with HTTP Range requests (a few MB)
  // and renders the first pages immediately. The rest of the book
  // keeps downloading in the background while the student reads;
  // jumping ahead range-fetches just the pages needed. The backend
  // /stream route forwards Range headers to R2 and answers 206.
  try {
    const loadingTask = pdfjsLib.getDocument({
      url: streamUrl,
      httpHeaders: { Authorization: `Bearer ${token}` },
      rangeChunkSize: 1048576,        // 1 MB chunks
      cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/cmaps/',         // fonts: without these, any book
      cMapPacked: true,               // using CID fonts fails page by page
      standardFontDataUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/standard_fonts/',   // with blank grey
    })
    loadingTask.onProgress = ({ loaded, total }) => {
      if (total) {
        document.getElementById('loading-text').textContent =
          'Opening book... ' + Math.min(99, Math.round((loaded / total) * 100)) + '%'
      } else if (loaded) {
        document.getElementById('loading-text').textContent =
          'Opening book... ' + (loaded / 1048576).toFixed(1) + ' MB'
      }
    }
    pdfDoc   = await loadingTask.promise
    numPages = pdfDoc.numPages
    await buildViewer()
  } catch (err) {
    console.warn('[viewer] progressive load failed, falling back to full download:', err?.message)
    try {
      const buf = await fetchPdfAsBlob()
      document.getElementById('loading-text').textContent = 'Rendering...'
      pdfDoc   = await pdfjsLib.getDocument({
        data: buf,
        cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/cmaps/', cMapPacked: true,
        standardFontDataUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/standard_fonts/',
      }).promise
      numPages = pdfDoc.numPages
      await buildViewer()
    } catch (err2) {
      console.error('[viewer]', err2)
      showError(err2.message || 'Could not load the PDF.', directUrl)
    }
  }

  async function applyZoom() {
    zoomInfo.textContent = Math.round(scale * 100) + '%'
    for (const c of container.querySelectorAll('.page-wrapper canvas')) {
      await renderPage(Number(c.closest('.page-wrapper').dataset.page))
    }
    container.querySelectorAll('.page-wrapper:not(:has(canvas))').forEach(w => {
      w.style.width = Math.round(595*scale)+'px'; w.style.height = Math.round(842*scale)+'px'
    })
  }

  document.getElementById('btn-zoom-in').onclick  = () => { scale = Math.min(3.0, +(scale+0.15).toFixed(2)); applyZoom() }
  document.getElementById('btn-zoom-out').onclick = () => { scale = Math.max(0.4, +(scale-0.15).toFixed(2)); applyZoom() }
  btnPrev.onclick = () => { if(currentPage>1){currentPage--;document.getElementById('page-'+currentPage)?.scrollIntoView({behavior:'smooth',block:'start'});updateUI()} }
  btnNext.onclick = () => { if(currentPage<numPages){currentPage++;document.getElementById('page-'+currentPage)?.scrollIntoView({behavior:'smooth',block:'start'});updateUI()} }
  document.getElementById('btn-fs').onclick = async () => {
    if (!document.fullscreenElement) { await document.documentElement.requestFullscreen?.(); document.getElementById('btn-fs').textContent='Exit full' }
    else { await document.exitFullscreen?.(); document.getElementById('btn-fs').textContent='Fullscreen' }
  }
  document.addEventListener('keydown', e => {
    if (e.key==='ArrowRight'||e.key==='ArrowDown') btnNext.click()
    if (e.key==='ArrowLeft'||e.key==='ArrowUp') btnPrev.click()
    if ((e.ctrlKey||e.metaKey)&&['s','S','p','P'].includes(e.key)){e.preventDefault();e.stopPropagation()}
  })
</script>
</body>
</html>
