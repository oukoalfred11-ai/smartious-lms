<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#A8203A"/>
      <stop offset="100%" stop-color="#6B0F1E"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#F0CC5A"/>
      <stop offset="100%" stop-color="#B8960C"/>
    </linearGradient>
  </defs>

  <!-- Background shield (rounded square with subtle bottom taper) -->
  <path d="M8 10 Q8 4 14 4 L50 4 Q56 4 56 10 L56 40 Q56 50 32 60 Q8 50 8 40 Z"
        fill="url(#shield)"/>

  <!-- Gold star at the top -->
  <path d="M32 12 L34 18 L40 18 L35.2 22 L37 28 L32 24.5 L27 28 L28.8 22 L24 18 L30 18 Z"
        fill="url(#gold)"/>

  <!-- Open book (white, bottom-heavy) -->
  <g transform="translate(32 42)">
    <!-- left page -->
    <path d="M-12 -5 Q-12 -7 -10 -7 L-1 -5 L-1 7 L-10 5 Q-12 5 -12 3 Z"
          fill="#FEFDFB" stroke="#FEFDFB" stroke-width="0.5"/>
    <!-- right page -->
    <path d="M12 -5 Q12 -7 10 -7 L1 -5 L1 7 L10 5 Q12 5 12 3 Z"
          fill="#FEFDFB" stroke="#FEFDFB" stroke-width="0.5"/>
    <!-- spine line -->
    <line x1="0" y1="-5" x2="0" y2="7" stroke="#FEFDFB" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
