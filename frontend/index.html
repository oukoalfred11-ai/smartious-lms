  <!-- ═══════════════════════════════════════════════════
       GOOGLE SEARCH CONSOLE OWNERSHIP VERIFICATION
       Do not remove. Lets Google Search Console see indexing,
       sitemap and Core Web Vitals data for this domain.
       ═══════════════════════════════════════════════════ -->
  <meta name="google-site-verification" content="eiGdv2Lik2kFbA9m2DXHDBdfbI6WYQzWtBQXOPZU5TY"/>

  <!-- ═══════════════════════════════════════════════════
       BING WEBMASTER TOOLS OWNERSHIP VERIFICATION
       Do not remove. Bing's index powers ChatGPT search,
       Copilot, DuckDuckGo, Yahoo and Ecosia — meaningful
       AI-answer-ecosystem coverage beyond Bing alone.
       ═══════════════════════════════════════════════════ -->
  <meta name="msvalidate.01" content="C0FEDFD7BDC2F88456F9DED6DFC17126"/>

  <!-- ═══════════════════════════════════════════════════
       PERFORMANCE — preconnect + preload (order matters)
       Place these FIRST so the browser starts resolving DNS
       and fetching critical resources before parsing the rest.
       ═══════════════════════════════════════════════════ -->

  <!-- Preconnect to font hosts (DNS + TLS handshake in parallel with HTML parse) -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>

  <!-- Preconnect to Cloudinary (hero video is the LCP on homepage) -->
  <link rel="preconnect" href="https://res.cloudinary.com" crossorigin/>

  <!-- Preconnect to Google Tag Manager for the Ads conversion script below -->
  <link rel="preconnect" href="https://www.googletagmanager.com"/>

  <!-- Preload the hero video (LCP element on homepage). Mobile and
       desktop browsers will fetch the version sized for their viewport
       once the actual <video> tag is parsed; the preload primes the
       connection. The poster image is also preloaded so the first
       paint isn't black while the video buffers. -->
  <link rel="preload" as="image" href="/hero-learning-centre.jpg" fetchpriority="high"/>

  <!-- Preload the single most-visible web font weight so the H1 doesn't FOUT -->
  <link rel="preload" as="font" type="font/woff2"
        href="https://fonts.gstatic.com/s/playfairdisplay/v37/nuFvD-vYSZviVYUb_rj3ij__anPXJzDwcbmjWBN2PKdFvUDQ.woff2"
        crossorigin/>

  <!-- DNS prefetch for third-party origins -->
  <link rel="dns-prefetch" href="https://smartious-backend.onrender.com"/>
  <link rel="dns-prefetch" href="https://formsubmit.co"/>

  <!-- ═══════════════════════════════════════════════════
       GOOGLE ADS CONVERSION TRACKING (gtag.js)
       Account: AW-17733479094 (Smartious Homeschool)
       Conversion actions configured in Google Ads UI:
         · US Consult Booked   ($50)
         · US Enrol Started    ($200)
         · US WhatsApp Click   ($20)
         · US Phone Click      ($20)
       Fired from LandingPage.jsx via the trackConversion() helper.
       ═══════════════════════════════════════════════════ -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-17733479094"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'AW-17733479094');
  </script>

  <!-- ═══════════════════════════════════════════════════
       Fonts (non-blocking load technique)
       Loaded with media="print" then swapped to "all" once
       loaded. This stops the stylesheet from blocking render.
       Saves ~700ms-1200ms of FCP on mobile.
       The <noscript> fallback ensures fonts still load if JS
       is disabled.
       ═══════════════════════════════════════════════════ -->
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Fira+Code:wght@400;500;600&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Syne:wght@400..800&family=Syne+Mono&display=swap"
        media="print"
        onload="this.media='all'"/>
  <noscript>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Fira+Code:wght@400;500;600&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Syne:wght@400..800&family=Syne+Mono&display=swap"/>
